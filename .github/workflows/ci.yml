name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Structural tests only — no GPU, no torch, no model downloads.
      - name: Install (light)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate config / data / models / notebooks / docs / secrets
        run: python -m pytest -q -m "not heavy"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Sphinx build (warnings are errors — same as Read the Docs)
        run: python -m sphinx -W --keep-going -b html -d docs/_build/doctrees docs docs/_build/html
