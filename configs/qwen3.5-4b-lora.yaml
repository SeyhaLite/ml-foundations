# Qwen3.5-4B LoRA — the recommended teaching model of this course.
# ~10GB VRAM for bf16 LoRA (Unsloth figures) → fits a Colab L4 (24GB) easily,
# tight but possible on T4 (16GB) with max_length 1024–2048 + grad checkpointing.
# REQUIRES transformers>=5.2. QLoRA 4-bit NOT recommended on Qwen3.5.
model:
  model_id: Qwen/Qwen3.5-4B
  max_length: 2048
  dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

training:
  output_dir: outputs/qwen3.5-4b-khmer
  dataset_path: data/sample_khmer_assistant.jsonl
  num_epochs: 2
  batch_size: 1
  grad_accum_steps: 16
  learning_rate: 1.0e-4
  warmup_ratio: 0.03
  eval_split_ratio: 0.1
  logging_steps: 10
  save_steps: 200
  seed: 42
  gradient_checkpointing: true
  packing: false
  completion_only_loss: true
  bf16: auto
  report_to: none

inference:
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  max_new_tokens: 1024
  enable_thinking: false
  repetition_penalty: 1.0
  presence_penalty: 1.5
