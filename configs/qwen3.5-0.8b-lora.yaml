# Qwen3.5-0.8B LoRA — smallest Qwen3.5; ~3GB VRAM for bf16 LoRA (Unsloth figures).
# REQUIRES transformers>=5.2 (verified: qwen3_5 model code first shipped in v5.2.0).
# QLoRA 4-bit is NOT recommended on Qwen3.5 (quantization sensitivity).
model:
  model_id: Qwen/Qwen3.5-0.8B
  max_length: 2048
  dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

training:
  output_dir: outputs/qwen3.5-0.8b-khmer
  dataset_path: data/sample_khmer_assistant.jsonl
  num_epochs: 2
  batch_size: 2
  grad_accum_steps: 8
  learning_rate: 1.0e-4
  warmup_ratio: 0.03
  eval_split_ratio: 0.1
  logging_steps: 10
  save_steps: 200
  seed: 42
  gradient_checkpointing: true
  packing: false
  completion_only_loss: true
  bf16: auto
  report_to: none

inference:
  # Official Qwen3.5 Instruct-mode sampling (general tasks):
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  max_new_tokens: 1024
  # Qwen3.5 Small models (0.8B/2B/4B/9B) default to thinking OFF.
  enable_thinking: false
  repetition_penalty: 1.0
  presence_penalty: 1.5
