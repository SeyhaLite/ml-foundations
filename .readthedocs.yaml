# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS and Python version used on RTD builders.
# (Official RTD example as of 2026: ubuntu-26.04 + Python 3.14.)
build:
  os: ubuntu-26.04
  tools:
    python: "3.13"

# Build the Sphinx site from docs/conf.py.
# fail_on_warning keeps the build honest (broken refs => red build).
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# Also publish offline formats
formats:
  - epub

# Light docs-only dependencies: sphinx + myst + myst-nb (+ design/copybutton).
# NOTE: intentionally does NOT install torch/transformers — notebooks are
# rendered from source, never executed (nb_execution_mode = "off").
python:
  install:
    - requirements: docs/requirements.txt
